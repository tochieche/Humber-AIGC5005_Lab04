[app]
source_url = "https://api.open-meteo.com/v1/forecast?latitude=43.65&longitude=-79.38&hourly=temperature_2m,precipitation&past_days=7&forecast_days=0&timezone=America%2FToronto"
timeout = 15
output_folder = "data/processed"
seed = 42
sample_size = 3
log_level = "INFO"

[shows]
names = ["Northern Lights", "City Stories", "Wild Horizons", "Mystery House", "Science Today"]
